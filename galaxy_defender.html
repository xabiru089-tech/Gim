<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galaxy Defender - Space Shooter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background: #000;
            font-family: 'Arial Black', Arial, sans-serif;
        }

        #gameContainer {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .hud {
            position: absolute;
            top: 2vh;
            left: 3vw;
            right: 3vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }

        .score-box {
            color: #00FFFF;
            font-size: 4vw;
            text-shadow: 0 0 10px #00FFFF, 0 0 20px #00FFFF;
            font-weight: bold;
        }

        .lives-box {
            display: flex;
            gap: 5px;
        }

        .life-icon {
            width: 6vw;
            height: 6vw;
            background: radial-gradient(circle, #FF6B6B 30%, #FF0000 70%);
            border-radius: 50%;
            box-shadow: 0 0 10px #FF0000;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: all;
            z-index: 30;
            backdrop-filter: blur(10px);
        }

        .hidden {
            display: none !important;
        }

        .game-title {
            font-size: 8vw;
            background: linear-gradient(45deg, #FF00FF, #00FFFF, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: 3vh;
            animation: glow 2s ease-in-out infinite alternate;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 10px #FF00FF); }
            to { filter: drop-shadow(0 0 20px #00FFFF); }
        }

        .subtitle {
            color: white;
            font-size: 3.5vw;
            margin-bottom: 4vh;
            text-align: center;
            opacity: 0.9;
            line-height: 1.6;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: 3px solid #00FFFF;
            padding: 3vh 10vw;
            font-size: 5vw;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 1vh;
        }

        .btn-primary:hover, .btn-primary:active {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.8);
        }

        .stats-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 3vh 5vw;
            border-radius: 15px;
            margin: 2vh 0;
            border: 2px solid rgba(0, 255, 255, 0.3);
        }

        .stat-row {
            color: white;
            font-size: 4vw;
            margin: 1.5vh 0;
            display: flex;
            justify-content: space-between;
            min-width: 250px;
        }

        .stat-label {
            color: #00FFFF;
        }

        .stat-value {
            color: #FFD700;
            font-weight: bold;
        }

        .controls-info {
            position: absolute;
            bottom: 3vh;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 3vw;
            text-align: center;
        }

        .powerup-indicator {
            position: absolute;
            bottom: 10vh;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }

        .powerup-icon {
            width: 8vw;
            height: 8vw;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5vw;
            opacity: 0.3;
            transition: opacity 0.3s;
        }

        .powerup-icon.active {
            opacity: 1;
            animation: powerupGlow 1s infinite;
        }

        @keyframes powerupGlow {
            0%, 100% { box-shadow: 0 0 10px currentColor; }
            50% { box-shadow: 0 0 20px currentColor, 0 0 30px currentColor; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div class="ui-overlay">
            <div class="hud" id="hud">
                <div class="score-box">SCORE: <span id="scoreDisplay">0</span></div>
                <div class="lives-box" id="livesBox"></div>
            </div>
            
            <div class="powerup-indicator" id="powerupIndicator">
                <div class="powerup-icon" id="rapidFire" style="background: #FF6B6B;">🔥</div>
                <div class="powerup-icon" id="shield" style="background: #4ECDC4;">🛡️</div>
                <div class="powerup-icon" id="multiShot" style="background: #FFD93D;">⚡</div>
            </div>
            
            <div class="screen" id="startScreen">
                <h1 class="game-title">GALAXY DEFENDER</h1>
                <p class="subtitle">
                    Pertahankan galaksi dari invasi alien!<br>
                    Kumpulkan power-up & raih skor tertinggi!
                </p>
                <button class="btn-primary" id="startBtn">START GAME</button>
                <div class="controls-info">
                    Drag untuk bergerak • Auto-fire aktif
                </div>
            </div>
            
            <div class="screen hidden" id="gameOverScreen">
                <h1 class="game-title">MISSION FAILED</h1>
                <div class="stats-container">
                    <div class="stat-row">
                        <span class="stat-label">Final Score:</span>
                        <span class="stat-value" id="finalScore">0</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">Enemies Destroyed:</span>
                        <span class="stat-value" id="enemiesDestroyed">0</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">High Score:</span>
                        <span class="stat-value" id="highScore">0</span>
                    </div>
                </div>
                <button class="btn-primary" id="restartBtn">RETRY MISSION</button>
            </div>
            
            <div class="screen hidden" id="pauseScreen">
                <h1 class="game-title">PAUSED</h1>
                <button class="btn-primary" id="resumeBtn">RESUME</button>
            </div>
        </div>
    </div>

    <!-- Load JavaScript files -->
    <script src="config.js"></script>
    <script src="sprites.js"></script>
    <script src="classes.js"></script>
    <script src="game.js"></script>
</body>
  </html>
